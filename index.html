<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deadwake Outfitters | Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="brand-logo" onclick="window.location.href='index.html'">DEADWAKE<span>.</span></div>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="products.html">Shop Apparel</a>
        </div>
        <div class="nav-actions">
            <button id="authNavBtn" class="nav-btn">Login / Signup</button>
            <button id="cartNavBtn" class="nav-btn cart-icon-btn">
                Cart 🛒 <span id="cartBadgeCount" class="cart-badge">0</span>
            </button>
        </div>
    </nav>

    <div class="hero main-hero">
        <h1>DEADWAKE OUTFITTERS</h1>
        <p>Premium Saltwater & Inshore Fishing Gear</p>
        <button class="cta-btn" onclick="window.location.href='products.html'">Shop The Collection</button>
    </div>

    <div class="container">
        <h2 class="section-title">Explore Gear</h2>
        <div class="category-grid">
            <div class="category-card" onclick="window.location.href='products.html'">
                <div class="category-icon">👕</div>
                <h3>Performance Shirts</h3>
                <p>UV Protection, breathable weaves built for long days on the water.</p>
            </div>
            <div class="category-card" onclick="window.location.href='products.html'">
                <div class="category-icon">🧢</div>
                <h3>Headwear</h3>
                <p>Durable snapbacks built to survive the salty ocean spray.</p>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-window">
            <button id="closeAuthBtn" class="modal-close">&times;</button>
            <div class="auth-tabs">
                <button id="loginTab" class="auth-tab active">Login</button>
                <button id="signupTab" class="auth-tab">Sign Up</button>
            </div>
            <form id="authForm">
                <div class="form-group" id="usernameGroup" style="display: none;">
                    <label>Full Name</label>
                    <input type="text" id="authName">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="authEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" required>
                </div>
                <button type="submit" id="authSubmitBtn" class="auth-submit-btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal-overlay">
        <div class="modal-window cart-window">
            <button id="closeCartBtn" class="modal-close">&times;</button>
            <h3 class="cart-title">Your Cart</h3>
            <div id="cartItemsContainer"></div>
            <div class="cart-total-section">
                <span>Total:</span>
                <span id="cartTotalValue">$0.00</span>
            </div>
            <button id="checkoutBtn" class="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
